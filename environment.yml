name: forecast
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Core scientific / forecasting stack
  - numpy=1.26.*
  - pandas=2.1.*
  - scipy=1.11.*
  - statsmodels=0.14.*
  - matplotlib=3.8.*
  - scikit-learn=1.4.*
  - pmdarima=2.0.*
  - prophet=1.1.*
  - cmdstan
  - cmdstanpy
  - tqdm

  # Database & Excel
  - pyodbc
  - sqlalchemy>=2.0,<3
  - openpyxl>=3.1,<4

  # Config
  - python-dotenv>=1.0,<2

  # Notebooks (optional)
  - ipykernel

  - pip:
      # Residual correction MVP
      - xgboost>=2.0,<3
      # Benchmark freeze panels
      - pyarrow>=14,<20
      # LSTM (forecast.py) — prefer pip wheels over conda
      - tensorflow>=2.15,<3
      # Google Sheets (optional)
      - gspread>=5.12,<7
      - gspread-formatting>=1.1,<2
      # M1 Optuna hyperparameter tuning (research only)
      - optuna>=3.6,<5
      # M2 residual learner benchmark (research only)
      - catboost>=1.2,<3
      - lightgbm>=4.0,<5
