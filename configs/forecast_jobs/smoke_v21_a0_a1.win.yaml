schema_version: "1"

run:
  run_id: smoke_v21_a0_a1
  output_dir: src/data/forecast_jobs

cohort:
  universe: v3a_architecture_validation_products
  # 5 representative SKUs (continuity / long / intermittent / stable / seasonal)
  products:
    - Recigen
    - Cinnatropin 10
    - Aryoseven 1
    - Melitide
    - Paglino 10

# Latest origin with all 15 horizons fully matured given sales through 140504
origins:
  - 140402

architectures:
  - v2.1
  - a0
  - a1

# Single seed for smoke runtime; still enough for deterministic re-run checks
seeds:
  - 41

horizon: 15

cutoff_policy:
  name: production

sales:
  path: src/data/benchmarks/v1/raw/sales.parquet
  read_only: true
  schema:
    columns: [product, date, sales]
    dtypes:
      product: string
      date: int64
      sales: float64
  expected:
    content_sha256: null
    n_rows: null
    size_bytes: null
    mtime_ns: null

execution:
  resume: true
  retry_failed: false
  force_job: false
  workers: 8
