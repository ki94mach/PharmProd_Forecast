# Residual-XGBoost v1.1 FULL — seven EVALUABLE residual_development origins.
# Cursor: validate / dry-run only. VPS may --execute / resume / evaluate.
# 16-core VPS sizing: outer_workers * xgb_n_jobs = 4 * 4 = 16 (no oversubscription).
schema_version: residual_xgb_v1_1
run:
  run_id: portfolio_residual_xgb_v1_1_full
  output_dir: src/data/results/portfolio_residual_xgb_v1
origins:
  - 140107
  - 140110
  - 140201
  - 140204
  - 140207
  - 140210
  - 140301
methods:
  - FROZEN_TS
  - TS_PLUS_TRAIN_MEDIAN_RESIDUAL_CORRECTION
  - TS_PLUS_RESIDUAL_XGB
HUMAN_XGB: BLOCKED_NO_DEVELOPMENT_VINTAGES
hb_outcomes_inspected: false
deterministic_seed: 42
execution:
  outer_workers: 4
  xgb_n_jobs: 4
  resume: true
  target_cpu_cores: 16
  note: >
    Full run on 16-core VPS: 4 origin jobs in parallel, each XGB fit uses n_jobs=4.
    Does not mutate frozen XGB_PARAMS; n_jobs override is residual-study only.
sales:
  path: src/data/results/product_universe/sales_full_portfolio_v1/sales.parquet
sources:
  v21_export: src/data/results/product_universe/portfolio_v21_backfill_v2_export
  a0_export: src/data/results/product_universe/portfolio_a0_backfill_v2_export
  residual_contract: src/data/results/portfolio_residual_xgb_v1/residual_study_contract_v1_1.json
  promotion_gates: src/data/results/portfolio_residual_xgb_v1/residual_promotion_gates_v1.json
